name: hello world
on:
  workflow_dispatch:  
    branches: 
      - main
    paths:
      - .github/workflows/hello.yml
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: writen hello world
        run: |
          echo "Hello World"
          pwd
          git -v
          ifconfig
  bye:
    runs-on: windows-latest
    needs: hello
    steps:
      - name: says bye
        run: |
          pwd
          ipconfig
